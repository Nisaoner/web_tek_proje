<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">Projem</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                </ul>
            </div>
        </div>
    </nav>

    <main class="container flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h4 class="mb-0 fw-bold">Öğrenci Girişi</h4>
                </div>
                <div class="card-body p-4">
                    
                    <div id="error-msg" class="alert alert-danger d-none text-center fw-bold">Kullanıcı adı veya şifre hatalı!</div>
                    <div id="js-error-msg" class="alert alert-warning d-none text-center fw-bold"></div>

                    <form action="login.php" method="POST" id="loginForm" onsubmit="return validateForm(event)">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Öğrenci E-posta Adresi</label>
                            <input type="text" class="form-control" id="email" name="email" placeholder="b251210069@sakarya.edu.tr">
                        </div>
                        <div class="mb-4">
                            <label for="sifre" class="form-label fw-bold">Şifre</label>
                            <input type="password" class="form-control" id="sifre" name="sifre" placeholder="Öğrenci Numaranız">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Sisteme Giriş Yap</button>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <script>
        // PHP'den dönen hataları göstermek için
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === '1') {
            document.getElementById('error-msg').classList.remove('d-none');
        }

        // HOCANIN İSTEDİĞİ: Boş alan ve Mail formatı JS kontrolü
        function validateForm(event) {
            const email = document.getElementById('email').value.trim();
            const sifre = document.getElementById('sifre').value.trim();
            const jsErrorMsg = document.getElementById('js-error-msg');
            
            // Mail formatı için basit bir Regex (düzenli ifade) kontrolü
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            // 1. Boş alan kontrolü
            if (email === '' || sifre === '') {
                event.preventDefault(); // Formun PHP'ye gitmesini durdur
                jsErrorMsg.textContent = "Lütfen e-posta ve şifre alanlarını boş bırakmayınız!";
                jsErrorMsg.classList.remove('d-none');
                document.getElementById('error-msg').classList.add('d-none');
                return false;
            }

            // 2. Mail formatı kontrolü
            if (!emailRegex.test(email)) {
                event.preventDefault(); // Formun PHP'ye gitmesini durdur
                jsErrorMsg.textContent = "Lütfen geçerli bir e-posta formatı giriniz (örn: isim@sakarya.edu.tr)!";
                jsErrorMsg.classList.remove('d-none');
                document.getElementById('error-msg').classList.add('d-none');
                return false;
            }

            // Hata yoksa PHP'ye gitmesine izin ver
            return true;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
