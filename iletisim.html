    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-light">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            
            <div id="app" class="col-md-8 bg-white p-5 rounded shadow">
                <h2 class="text-center mb-4 border-bottom pb-3 text-danger fw-bold">Bize Ulaşın</h2>
                
                <div v-if="vueError" class="alert alert-danger fw-bold" v-text="vueError"></div>
                <div id="nativeError" class="alert alert-warning fw-bold d-none"></div>

                <form action="iletisim.php" method="POST" id="contactForm" ref="contactForm">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label fw-bold">Adınız Soyadınız:</label>
                            <input type="text" class="form-control" name="isim" id="name" v-model="formData.name" placeholder="Örn: Nisa Nur Öner">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label fw-bold">E-posta Adresiniz:</label>
                            <input type="text" class="form-control" name="email" id="email" v-model="formData.email" placeholder="ornek@sakarya.edu.tr">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label fw-bold">Telefon Numaranız:</label>
                        <input type="text" class="form-control" name="telefon" id="phone" v-model="formData.phone" placeholder="05xxxxxxxxx">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold d-block">Cinsiyetiniz:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="cinsiyet" id="kadin" value="Kadın" v-model="formData.gender">
                            <label class="form-check-label" for="kadin">Kadın</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="cinsiyet" id="erkek" value="Erkek" v-model="formData.gender">
                            <label class="form-check-label" for="erkek">Erkek</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="subject" class="form-label fw-bold">Mesaj Konusu:</label>
                        <select class="form-select" name="konu" id="subject" v-model="formData.subject">
                            <option value="">Seçim yapınız...</option>
                            <option value="Destek">Teknik Destek</option>
                            <option value="Oneri">Öneri ve Şikayet</option>
                            <option value="Diger">Diğer</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label fw-bold">Mesajınız:</label>
                        <textarea class="form-control" name="mesaj" id="message" rows="4" v-model="formData.message" placeholder="Mesajınızı detaylandırın..."></textarea>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" name="onay" id="terms" v-model="formData.terms">
                        <label class="form-check-label text-muted small" for="terms">Kişisel verilerimin işlenmesini onaylıyorum.</label>
                    </div>

                    <hr>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                        <button type="button" class="btn btn-dark fw-bold px-4" onclick="validateNative()">Native JS İle Kontrol Et ve Gönder</button>
    
                        <button type="button" class="btn btn-success fw-bold px-4" @click="validateVue">Vue.js İle Kontrol Et ve Gönder</button>
    
                        <button type="reset" class="btn btn-outline-danger fw-bold px-4" @click="resetErrors">Formu Temizle</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    formData: { name: '', email: '', phone: '', gender: '', subject: '', message: '', terms: false },
                    vueError: ''
                }
            },
            methods: {
                validateVue() {
                    // Diğer hata kutusunu gizle
                    document.getElementById('nativeError').classList.add('d-none');
                    this.vueError = '';

                    // Boş Alan Kontrolü
                    if(!this.formData.name || !this.formData.email || !this.formData.phone || !this.formData.gender || !this.formData.subject || !this.formData.message) {
                        this.vueError = "VUE.JS HATASI: Lütfen tüm alanları eksiksiz doldurun!";
                        return;
                    }
                    // Email Format Kontrolü (Regex)
                    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if(!emailPattern.test(this.formData.email)) {
                        this.vueError = "VUE.JS HATASI: Lütfen geçerli bir e-posta adresi girin!";
                        return;
                    }
                    // Telefon Sadece Rakam Kontrolü (Regex)
                    const phonePattern = /^[0-9]+$/;
                    if(!phonePattern.test(this.formData.phone)) {
                        this.vueError = "VUE.JS HATASI: Telefon numarası sadece rakamlardan oluşmalıdır!";
                        return;
                    }
                    // Checkbox Onay Kontrolü
                    if(!this.formData.terms) {
                        this.vueError = "VUE.JS HATASI: Lütfen sözleşmeyi onaylayın!";
                        return;
                    }

                    // Her şey tamamsa formu PHP'ye gönder
                    this.$refs.contactForm.submit();
                },
                resetErrors() {
                    this.vueError = '';
                    document.getElementById('nativeError').classList.add('d-none');
                }
            }
        }).mount('#app');
    </script>

    <script>
        function validateNative() {
            const nativeErr = document.getElementById('nativeError');
            nativeErr.classList.add('d-none');
            nativeErr.innerText = '';

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value.trim();
            const terms = document.getElementById('terms').checked;
            
            // Radio button kontrolü
            let genderSelected = false;
            const genders = document.getElementsByName('cinsiyet');
            for(let i=0; i<genders.length; i++) {
                if(genders[i].checked) genderSelected = true;
            }

            // Boş Alan Kontrolü
            if(!name || !email || !phone || !subject || !message || !genderSelected) {
                nativeErr.innerText = "NATIVE JS HATASI: Lütfen tüm alanları doldurunuz!";
                nativeErr.classList.remove('d-none');
                return;
            }
            // Email Format Kontrolü
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(!emailPattern.test(email)) {
                nativeErr.innerText = "NATIVE JS HATASI: Lütfen geçerli bir e-posta formatı kullanın!";
                nativeErr.classList.remove('d-none');
                return;
            }
            // Telefon Rakam Kontrolü
            const phonePattern = /^[0-9]+$/;
            if(!phonePattern.test(phone)) {
                nativeErr.innerText = "NATIVE JS HATASI: Telefon alanı harf veya boşluk içeremez, sadece rakam giriniz!";
                nativeErr.classList.remove('d-none');
                return;
            }
            // Checkbox Kontrolü
            if(!terms) {
                nativeErr.innerText = "NATIVE JS HATASI: Kişisel verilerin işlenmesini onaylamanız gerekmektedir!";
                nativeErr.classList.remove('d-none');
                return;
            }

            // Her şey tamamsa formu submit et
            document.getElementById('contactForm').submit();
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
     <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. URL'den gelen giriş sinyalini yakala
            const urlParams = new URLSearchParams(window.location.search);
            const incomingUser = urlParams.get('user');
            
            if (incomingUser) {
                // Tarayıcı hafızasına kaydet
                localStorage.setItem('aktif_kullanici', incomingUser);
                //sadece index.html kalsın
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            // 2. Hafızada kullanıcı var mı kontrol et
            const aktifKullanici = localStorage.getItem('aktif_kullanici');
            
            if (aktifKullanici) {
                // Menüdeki "Giriş Yap" linkini bul
                const loginLinkleri = document.querySelectorAll('a[href="login.html"]');
                
                loginLinkleri.forEach(link => {
                    const parentLi = link.parentElement;
                    // Giriş yapılmışsa menüyü otomatik değiştir
                    parentLi.innerHTML = `
                        <span class="nav-link text-info fw-bold">Hoş geldin, ${aktifKullanici}</span>
                        </li>
                        <li class="nav-item ms-2">
                            <a class="nav-link text-danger fw-bold" href="#" onclick="cikisYap()">Çıkış Yap</a>
                    `;
                });
            }
        });

        // Çıkış yapma fonksiyonu
        function cikisYap() {
            localStorage.removeItem('aktif_kullanici'); // Hafızayı sil
            window.location.href = "index.html"; // Ana sayfaya at
        }
    </script>
</body>
</html>
